<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learn C Programming</title>
<style>
body { font-family: Arial; margin: 20px; }
textarea { width: 100%; height: 250px; font-family: monospace; }
.output { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h1>C Programming Tutorial</h1>
<p>This editor is for learning and practice.</p>

<textarea placeholder="Write C code here..."></textarea>
<button onclick="runC()">Run C Code</button>

<div class="output" id="output">Output will appear here...</div>

<script>
function runC() {
    document.getElementById("output").textContent =
        "C code execution requires a backend compiler.\n" +
        "This editor is provided for learning purposes only.";
}
</script>

</body>
</html>
