<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learn Python</title>
<style>
body { font-family: Arial; margin: 20px; }
textarea { width: 100%; height: 250px; font-family: monospace; }
.output { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h1>Python Tutorial</h1>
<p>This editor is for learning and practice.</p>

<textarea placeholder="Write Python code here..."></textarea>
<button onclick="runPython()">Run Python Code</button>

<div class="output" id="output">Output will appear here...</div>

<script>
function runPython() {
    document.getElementById("output").textContent =
        "Python execution requires a backend environment.\n" +
        "This platform focuses on syntax learning and practice.";
}
</script>

</body>
</html>
